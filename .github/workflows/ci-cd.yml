# Delivery360 - GitHub Actions CI/CD Pipeline

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        id: backend-dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Run linting
        run: |
          cd backend
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check formatting
        if: ${{ !cancelled() && steps.backend-dependencies.outcome == 'success' }}
        run: |
          cd backend
          black --check app

      - name: Type check
        if: ${{ !cancelled() && steps.backend-dependencies.outcome == 'success' }}
        run: |
          cd backend
          mypy app --ignore-missing-imports

      - name: Run tests
        if: ${{ !cancelled() && steps.backend-dependencies.outcome == 'success' }}
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          TEST_NOTIFICATION_REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-only-synthetic-signing-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          ENVIRONMENT: testing
      
      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('backend/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # Frontend Tests
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        id: frontend-dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run linting
        run: |
          cd frontend
          npm run lint
      
      - name: Type check
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        run: |
          cd frontend
          npm run type-check
      
      - name: Run tests
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        run: |
          cd frontend
          npm run test -- --coverage --watchAll=false
      
      - name: Build
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api-test.delivery360.com
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend

  backend-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and inventory the resolved runtime dependencies
        run: |
          pip install -r backend/requirements.txt
          pip check
          mkdir -p resolved-backend
          pip freeze > resolved-backend/requirements.txt
      - name: Scan installed packages, including transitive dependencies
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: fs
          scan-ref: ./resolved-backend
          scanners: vuln
          format: json
          output: backend-installed-audit.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('backend-installed-audit.json') != '' }}
        with:
          name: backend-installed-audit
          path: |
            backend-installed-audit.json
            resolved-backend/requirements.txt

  backend-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the production backend without publishing
        run: docker build -t delivery360-backend:ci backend
      - name: Start isolated database and Redis test containers
        run: |
          docker network create backend-ci
          docker run -d --name backend-db-ci --network backend-ci -e POSTGRES_USER=ci_user -e POSTGRES_PASSWORD=ci-test-only-password -e POSTGRES_DB=test_container postgis/postgis:16-3.4
          docker run -d --name backend-redis-ci --network backend-ci redis:7-alpine
          for attempt in {1..30}; do
            if docker exec backend-db-ci pg_isready -U ci_user -d test_container && docker exec backend-redis-ci redis-cli ping; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run the backend with production filesystem and permission restrictions
        run: |
          docker run -d --name backend-api-ci --network backend-ci --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,uid=10001,gid=10001 \
            --tmpfs /app/uploads:rw,nosuid,nodev,size=64m,uid=10001,gid=10001 \
            -e ENVIRONMENT=production -e SECRET_KEY=ci-only-synthetic-signing-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            -e DATABASE_URL=postgresql://ci_user:ci-test-only-password@backend-db-ci:5432/test_container \
            -e REDIS_URL=redis://backend-redis-ci:6379/0 -p 127.0.0.1:8073:8000 delivery360-backend:ci
          docker exec backend-api-ci python -c "import os, importlib.util; assert os.getuid() == 10001; assert importlib.util.find_spec('jose') is None; assert importlib.util.find_spec('pytest') is None"
      - name: Verify live dependencies, anonymous API boundary and raw body limits
        run: |
          python scripts/smoke_backend.py --base-url http://127.0.0.1:8073
          schema_absent=$(docker exec backend-db-ci psql -U ci_user -d test_container -Atc "SELECT to_regclass('public.users') IS NULL")
          test "$schema_absent" = t
      - name: Verify readiness fails without restarting for Redis outages
        run: |
          docker stop backend-redis-ci
          python scripts/smoke_backend.py --base-url http://127.0.0.1:8073 --redis-down
      - name: Stop only the test containers and network
        if: always()
        run: |
          docker rm -f -v backend-api-ci backend-db-ci backend-redis-ci || true
          docker network rm backend-ci || true

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements-release.txt
      - run: python -m unittest discover -s scripts/tests -v
      - run: |
          python scripts/release.py manifest --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --backend-digest "sha256:$(printf 'a%.0s' {1..64})" --frontend-digest "sha256:$(printf 'b%.0s' {1..64})" --output sample-images.json
          python scripts/release.py render --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --input sample-images.json --environment staging --host staging.example.invalid --output staging-plan.json
          python scripts/release.py render --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --input sample-images.json --environment production --host app.delivery360.com --output production-plan.json
      - run: python scripts/validate_manifest.py staging-plan.json production-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan-examples
          path: '*-plan.json'

  frontend-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build production image without publishing
        run: docker build --build-arg NEXT_PUBLIC_API_URL=/api/v1 -t delivery360-frontend:ci frontend
      - name: Smoke test non-root production server
        run: |
          docker run -d --name frontend-ci --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000 \
            --tmpfs /app/.next/cache:rw,nosuid,nodev,size=64m,uid=1000,gid=1000 \
            -p 127.0.0.1:3072:3000 delivery360-frontend:ci
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3072/login > /dev/null; then
              docker exec frontend-ci node -e "if(process.getuid()===0||process.env.NODE_ENV!=='production')process.exit(1)"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify production assets, form validation and catalog regressions
        run: |
          chromium=$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python frontend/e2e/production-smoke.browser.py --chromium "$chromium" --artifacts-dir browser-artifacts/production
          python frontend/e2e/rider-audit-catalog.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/catalog
          python frontend/e2e/rider-audit.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/detail
          python frontend/e2e/delivery-catalog.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/deliveries
          python frontend/e2e/fleet.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/fleet
          python frontend/e2e/riders.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/riders
          python frontend/e2e/rider-profile-documents.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/profile-documents
          python frontend/e2e/rider-map.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/rider-map
          python frontend/e2e/personal-alerts.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/personal-alerts
          python frontend/e2e/user-administration.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/users
          python frontend/e2e/system-audit.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/system-audit
          python frontend/e2e/role-catalog.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/role-catalog
          python frontend/e2e/platform-settings.browser.py --base-url http://127.0.0.1:3072 --chromium "$chromium" --artifacts-dir browser-artifacts/platform-settings
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('browser-artifacts/**') != '' }}
        with:
          name: production-browser-checks
          path: browser-artifacts
      - name: Stop local test container
        if: always()
        run: docker rm -f frontend-ci || true

  local-functional-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the real browser test runner
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build and start the isolated functional laboratory
        run: |
          python scripts/local_test.py init
          python scripts/local_test.py up
      - name: Verify real sessions, writes, permissions and restart persistence
        run: |
          chromium=$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python frontend/e2e/local-functional.browser.py --chromium "$chromium" --restart --artifacts-dir browser-real
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('browser-real/**') != '' }}
        with:
          name: local-functional-browser-checks
          path: browser-real
      - name: Stop only this laboratory and retain its volumes
        if: always()
        run: |
          if test -f .delivery360-testing/config.json; then python scripts/local_test.py down; fi

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan backend and fail on high or critical findings
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Scan frontend even if backend reports findings
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('trivy-*-results.sarif') != '' }}
        with:
          name: repository-security-reports
          path: trivy-*-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() && hashFiles('trivy-backend-results.sarif') != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() && hashFiles('trivy-frontend-results.sarif') != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

  release-readiness:
    if: always()
    needs: [backend-test, frontend-test, frontend-security, backend-security, backend-container, release-contract, frontend-container, local-functional-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('Release blocked: one or more required checks did not pass')
          PY

  build-backend:
    needs: release-readiness
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the canonical immutable image tag
        id: image
        env:
          COMPONENT: backend
        run: |
          python - <<'PY'
          import os
          from scripts.release import image_names
          names = image_names(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + names[os.environ['COMPONENT']] + '\n')
          PY
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          platforms: linux/amd64,linux/arm64
  build-frontend:
    needs: release-readiness
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the canonical immutable image tag
        id: image
        env:
          COMPONENT: frontend
        run: |
          python - <<'PY'
          import os
          from scripts.release import image_names
          names = image_names(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + names[os.environ['COMPONENT']] + '\n')
          PY
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1

  release-images:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record both published digests for this exact commit
        env:
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.digest }}
        run: python scripts/release.py manifest --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --backend-digest "$BACKEND_DIGEST" --frontend-digest "$FRONTEND_DIGEST" --output release-images.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: release-images.json
          retention-days: 30
