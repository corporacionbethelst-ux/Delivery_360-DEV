# Delivery360 - Kustomize Configuration
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: delivery360

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets-template.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - celery.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
  - network-policies.yaml

commonLabels:
  app.kubernetes.io/name: delivery360
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

images:
  - name: delivery360/backend
    newName: delivery360/backend
    newTag: latest
  - name: delivery360/frontend
    newName: delivery360/frontend
    newTag: latest

configMapGenerator: []

secretGenerator: []
