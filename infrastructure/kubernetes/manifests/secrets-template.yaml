# Delivery360 - Secrets (Template)
# NOTA: En producción, usar External Secrets o SOPS para gestión segura
# Este archivo es solo template - NO commitar valores reales al repositorio
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: delivery360
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<GENERAR_CONTRASENA_SEGURA>"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: delivery360
type: Opaque
stringData:
  REDIS_PASSWORD: "<GENERAR_CONTRASENA_SEGURA>"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: delivery360
type: Opaque
stringData:
  SECRET_KEY: "<GENERAR_SECRET_KEY_64_CHARS>"
  JWT_PRIVATE_KEY: "<RSA_PRIVATE_KEY>"
  JWT_PUBLIC_KEY: "<RSA_PUBLIC_KEY>"
  SMTP_USERNAME: "<SMTP_USER>"
  SMTP_PASSWORD: "<SMTP_PASS>"
  MAPBOX_TOKEN: "<MAPBOX_API_KEY>"
  SENTRY_DSN: "<SENTRY_DSN_URL>"
  AWS_ACCESS_KEY_ID: "<AWS_KEY>"
  AWS_SECRET_ACCESS_KEY: "<AWS_SECRET>"
  STRIPE_SECRET_KEY: "<STRIPE_SECRET>"
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
  namespace: delivery360
type: Opaque
stringData:
  NEXTAUTH_SECRET: "<NEXTAUTH_SECRET_32_CHARS>"
  ANALYTICS_ID: "<ANALYTICS_ID>"
